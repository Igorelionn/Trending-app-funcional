events {
    worker_connections 65536;    # suporta 65k conexões simultâneas
    multi_accept on;
    use epoll;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    # Otimizações para HLS
    sendfile on;
    tcp_nopush on;
    tcp_nodelay on;
    keepalive_timeout 65;
    keepalive_requests 10000;

    # Gzip para HLS playlists (.m3u8)
    gzip on;
    gzip_types text/plain application/vnd.apple.mpegurl;

    # Limites de upload (stream do streamer via WHIP)
    client_max_body_size 0;     # sem limite (stream contínua)
    client_body_timeout 300s;

    # Log mínimo para não encher disco
    access_log off;
    error_log /var/log/nginx/error.log warn;

    # ── Redirect HTTP → HTTPS ────────────────────────────────────
    server {
        listen 80;
        server_name SEU_DOMINIO_AQUI;   # ex: stream.seusite.com.br

        location /.well-known/acme-challenge/ {
            root /var/www/certbot;
        }

        location / {
            return 301 https://$host$request_uri;
        }
    }

    # ── HTTPS + proxy para MediaMTX ─────────────────────────────
    server {
        listen 443 ssl http2;
        server_name SEU_DOMINIO_AQUI;

        ssl_certificate     /etc/letsencrypt/live/SEU_DOMINIO_AQUI/fullchain.pem;
        ssl_certificate_key /etc/letsencrypt/live/SEU_DOMINIO_AQUI/privkey.pem;
        ssl_protocols TLSv1.2 TLSv1.3;
        ssl_ciphers HIGH:!aNULL:!MD5;

        # CORS — Cloudflare e o app Vercel podem acessar
        add_header Access-Control-Allow-Origin  "*" always;
        add_header Access-Control-Allow-Methods "GET, POST, DELETE, OPTIONS" always;
        add_header Access-Control-Allow-Headers "Authorization, Content-Type" always;

        # ── WHIP ingest (browser → servidor) ────────────────────
        location /whip/ {
            proxy_pass http://127.0.0.1:8189;
            proxy_http_version 1.1;
            proxy_buffering off;
            proxy_request_buffering off;
            proxy_set_header Host $host;
        }

        # ── HLS output (servidor → viewers via Cloudflare) ──────
        location /hls/ {
            proxy_pass http://127.0.0.1:8888;
            proxy_http_version 1.1;
            proxy_buffering off;          # crucial: sem buffer para baixa latência
            proxy_set_header Host $host;

            # Cache de segmentos HLS no nginx (alivia o MediaMTX)
            proxy_cache_valid 200 2s;     # segmentos válidos por 2s
            expires -1;                   # não cache no browser, Cloudflare gerencia
        }
    }
}
